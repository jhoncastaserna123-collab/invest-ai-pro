
name: Crear APK de INVEST AI PRO

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "INVEST_AI_PRO_RELEASE.zip"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Verificar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          SDK=/usr/local/lib/android/sdk

          echo "Versiones instaladas:"
          ls "$SDK/platforms"
          ls "$SDK/build-tools"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

      - name: Preparar archivos
        shell: bash
        run: |
          mkdir -p source

          if [ ! -f INVEST_AI_PRO_RELEASE.zip ]; then
            echo "No se encuentra INVEST_AI_PRO_RELEASE.zip"
            exit 1
          fi

          unzip -q INVEST_AI_PRO_RELEASE.zip -d source

          mkdir -p app/src/main/assets

          FILE=$(find source -type f -iname index.html | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No se encontró index.html dentro del ZIP"
            find source -maxdepth 4 -type f
            exit 1
          fi

          cp "$FILE" app/src/main/assets/index.html

      - name: Crear proyecto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/invest/aipro

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "InvestAIPro"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.invest.aipro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.invest.aipro'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="INVEST AI PRO"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/invest/aipro/MainActivity.java <<'EOF'
          package com.invest.aipro;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: INVEST-AI-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
